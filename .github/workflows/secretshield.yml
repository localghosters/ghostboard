name: SecretShield

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecretShield
        run: pip install --upgrade secretshield

      - name: Scan for secrets
        run: secretshield scan .
